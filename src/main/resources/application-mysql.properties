spring.datasource.url=${DATAAGENT_DB_URL:jdbc:mysql://localhost:3306/dataagent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DATAAGENT_DB_USERNAME:root}
spring.datasource.password=${DATAAGENT_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis.configuration.map-underscore-to-camel-case=true

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/mysql/schema.sql

dataagent.storage.root=${DATAAGENT_STORAGE_ROOT:./data/uploads}
